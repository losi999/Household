<div mat-dialog-title>
  Projekt
</div>
<div mat-dialog-content>
  <div class="search">
    <shared-clearable-input label="Keresés" [(value)]="searchValue" />
  </div>
  <mat-action-list>
    @for (project of selectableProjects(); track project) {
    <button mat-list-item (click)="onSelect(project)"> {{project.name}} </button>
    }
  </mat-action-list>
</div>
<div mat-dialog-actions>
  <button matButton="text" type="button" mat-dialog-close>Mégse</button>
</div>
