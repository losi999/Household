<div mat-dialog-title>
  Termék
</div>
<div mat-dialog-content>
  <div class="search">
    <shared-clearable-input label="Keresés" [(value)]="searchValue" />
  </div>
  <mat-action-list>
    @for (product of selectableProducts(); track product.productId) {
    <button mat-list-item (click)="onSelect(product)" [class]="product.productType">
      <div matListItemTitle>{{product.name}}</div>
      @if (product.productType === 'specific') {
      <div matListItemLine data-testId="measurement">{{product.measurement}} {{product.unitOfMeasurement}}</div>
      }
      @if (product.productType !== 'generic') {
      <div matListItemLine data-testId="full-name">{{product.fullName}}</div>
      }
    </button>
    }
  </mat-action-list>
</div>
<div mat-dialog-actions>
  <button matButton="text" type="button" mat-dialog-close>Mégse</button>
</div>
