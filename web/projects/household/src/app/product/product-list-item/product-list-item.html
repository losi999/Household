<button mat-list-item (click)="onShowMenu()" [disabled]="isDisabled()">
  @switch (product().productType) {
  @case ('generic') {
  <household-generic-product-icon matListItemIcon />
  }
  @case ('specific') {
  <household-specific-product-icon matListItemIcon />
  }
  @case ('variant') {
  <household-variant-product-icon matListItemIcon />
  }
  }
  <div matListItemTitle>{{product().name}}</div>
  @if (measurement()) {
  <div matListItemLine>{{measurement()}}</div>
  }
</button>
