<div mat-dialog-title>
  {{product.fullName}}
  <mat-chip-set>
    @for (product of selectedProducts(); track product.productId) {
    <mat-chip (click)="onRemoveProduct(product)">
      {{product.fullName}}
      <mat-icon matChipTrailingIcon>cancel</mat-icon>
    </mat-chip>
    }
  </mat-chip-set>
</div>
<div mat-dialog-content>
  <mat-action-list>
    @for (product of products(); track product.productId) {
    <button mat-list-item (click)="onAddProduct(product)">
      <div matListItemTitle>{{product.name}}</div>
      @if (product.productType === 'specific') {
      <div matListItemLine>{{product.measurement}} {{product.unitOfMeasurement}}</div>
      }
    </button>
    }
  </mat-action-list>
</div>
<div mat-dialog-actions>
  <button matButton="filled" data-testId="save-button" [disabled]="selectedProducts().length === 0" (click)="onSave()">Mentés</button>
  <button matButton="text" mat-dialog-close>Mégse</button>
</div>
