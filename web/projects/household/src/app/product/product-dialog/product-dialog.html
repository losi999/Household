<div mat-dialog-title>{{product ? 'Termék szerkesztése' : 'Új termék'}}</div>
<div mat-dialog-content>
  <div>
    <shared-clearable-input data-testId="name" label="Név" [formField]="productForm.name" />
  </div>
  @if (canHaveParent) {
  <household-product-selector label="Szülő" [items]="parentProductItems()" [formField]="productForm.parentProduct" />
  }
  @if (isSpecific()) {
  <div>
    <shared-clearable-input data-testId="measurement" type="number" label="Mennyiség" [formField]="productForm.measurement" />
  </div>
  <mat-form-field appearance="fill">
    <mat-label>Mértékegység</mat-label>
    <mat-select data-testId="unit-of-measurement" [formField]="productForm.unitOfMeasurement">
      @for (u of unitsOfMeasurement; track u) {
      <mat-option [value]="u">
        {{u}}
      </mat-option>
      }
    </mat-select>
  </mat-form-field>
  }
</div>
<div mat-dialog-actions>
  <button matButton="filled" data-testId="save-button" [disabled]="productForm().invalid()" (click)="onSave()">Mentés</button>
  <button matButton="text" type="button" mat-dialog-close>Mégse</button>
</div>
