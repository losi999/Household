<h2>{{data.title}}</h2>
<mat-action-list>
  @for(item of data.items; track $index) {
  @if (item.link) {
  <a mat-list-item [routerLink]="item.link" (click)="onSelect()">
    <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
    <div matListItemTitle>{{item.label}}</div>
  </a>
  } @else if (item.action) {
  <button mat-list-item type="button" (click)="onSelect(item.action)">
    <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
    <div matListItemTitle>{{item.label}}</div>
  </button>
  }
  }
</mat-action-list>
